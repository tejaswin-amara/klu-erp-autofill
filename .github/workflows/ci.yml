name: Repository quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run structural regression tests
        run: npm test
      - name: Test release packager
        run: npm run test:package
      - name: Build release archive
        run: python scripts/package_extension.py --output "$RUNNER_TEMP/klu-erp-autofill.zip"
      - name: Upload release archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: klu-erp-autofill-extension
          path: |
            ${{ runner.temp }}/klu-erp-autofill.zip
            ${{ runner.temp }}/klu-erp-autofill.zip.sha256
          if-no-files-found: error
          retention-days: 14
